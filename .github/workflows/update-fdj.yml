name: Mise à jour des données FDJ

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 2,5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger et traiter les archives FDJ
        shell: python
        run: |
          import urllib.request
          import zipfile
          import io
          import csv
          import json
          import re
          from datetime import datetime

          PAGE = "https://www.fdj.fr/jeux-de-tirage/euromillions-my-million/historique"

          html = urllib.request.urlopen(
              urllib.request.Request(
                  PAGE,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
          ).read().decode("utf-8", errors="ignore")

          urls = sorted(set(re.findall(
              r'https://www\.sto\.api\.fdj\.fr/anonymous/service-draw-info/v3/documentations/[a-zA-Z0-9-]+',
              html
          )))

          if not urls:
              raise RuntimeError("Aucune archive FDJ trouvée.")

          draws = {}

          for url in urls:
              print("Téléchargement :", url)

              data = urllib.request.urlopen(
                  urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
              ).read()

              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  for name in z.namelist():
                      if not name.lower().endswith((".csv", ".txt")):
                          continue

                      raw = z.read(name).decode("utf-8-sig", errors="ignore")

                      try:
                          rows = csv.DictReader(raw.splitlines(), delimiter=";")
                      except Exception:
                          continue

                      for row in rows:
                          r = {
                              str(k).strip().lower(): str(v).strip()
                              for k, v in row.items()
                              if k is not None
                          }

                          date = (
                              r.get("date")
                              or r.get("date_tirage")
                              or r.get("draw_date")
                          )

                          nums = []
                          for i in range(1, 6):
                              v = (
                                  r.get(f"boule_{i}")
                                  or r.get(f"numero_{i}")
                                  or r.get(f"number_{i}")
                              )
                              if v:
                                  m = re.search(r"\d+", v)
                                  if m:
                                      nums.append(int(m.group()))

                          stars = []
                          for i in range(1, 3):
                              v = (
                                  r.get(f"etoile_{i}")
                                  or r.get(f"star_{i}")
                                  or r.get(f"chance_{i}")
                              )
                              if v:
                                  m = re.search(r"\d+", v)
                                  if m:
                                      stars.append(int(m.group()))

                          if date and len(nums) == 5 and len(stars) == 2:
                              nums = sorted(nums)

                              key = (
                                  date,
                                  tuple(nums),
                                  tuple(stars)
                              )

                              draws[str(key)] = {
                                  "date": date,
                                  "numbers": nums,
                                  "stars": stars
                              }

          result = list(draws.values())
          result.sort
